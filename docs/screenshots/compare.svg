<svg viewBox="0 0 680 392" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>langlab 与课程型 App、闪卡工具的能力对比</title>
<desc>从内容来源、记忆调度、产出训练、语音反馈、阅读整合、数据归属、上手成本七个维度，对比课程型 App、闪卡工具与 langlab。</desc>

<rect width="680" height="392" fill="#FFFFFF"/>

<text x="40" y="26" font-size="15" font-weight="500" fill="#2C2C2A">三种方案的能力对比</text>
<text x="40" y="46" font-size="12" fill="#888780">内容 · 记忆 · 产出 · 反馈 · 整合 · 归属 · 成本</text>

<rect x="40" y="60" width="600" height="38" rx="8" fill="#F1EFE8"/>
<text x="56" y="79" font-size="13" fill="#5F5E5A">维度</text>
<text x="206" y="79" font-size="13" fill="#5F5E5A">课程型 App（Duolingo 一类）</text>
<text x="386" y="79" font-size="13" fill="#5F5E5A">闪卡工具（Anki 一类）</text>
<text x="546" y="79" font-size="13" font-weight="500" fill="#0F6E56">langlab</text>

<g font-size="13" fill="#444441">
  <rect x="40" y="98" width="600" height="40" fill="#FBFBF9"/>
  <text x="56" y="118" dominant-baseline="central">内容来源</text>
  <text x="206" y="118" dominant-baseline="central">平台的通用课程</text>
  <text x="386" y="118" dominant-baseline="central">你自己建卡</text>
  <text x="546" y="118" dominant-baseline="central" fill="#0F6E56" font-weight="500">你的真实材料</text>

  <rect x="40" y="138" width="600" height="40" fill="#FFFFFF"/>
  <text x="56" y="158" dominant-baseline="central">记忆调度</text>
  <text x="206" y="158" dominant-baseline="central" fill="#888780">弱</text>
  <text x="386" y="158" dominant-baseline="central">最强</text>
  <text x="546" y="158" dominant-baseline="central" fill="#0F6E56" font-weight="500">有（SM-2）</text>

  <rect x="40" y="178" width="600" height="40" fill="#FBFBF9"/>
  <text x="56" y="198" dominant-baseline="central">产出训练</text>
  <text x="206" y="198" dominant-baseline="central" fill="#888780">有限</text>
  <text x="386" y="198" dominant-baseline="central" fill="#888780">取决于你怎么做卡</text>
  <text x="546" y="198" dominant-baseline="central" fill="#0F6E56" font-weight="500">内置产出模式</text>

  <rect x="40" y="218" width="600" height="40" fill="#FFFFFF"/>
  <text x="56" y="238" dominant-baseline="central">语音反馈</text>
  <text x="206" y="238" dominant-baseline="central" fill="#888780">基础识别</text>
  <text x="386" y="238" dominant-baseline="central" fill="#888780">无</text>
  <text x="546" y="238" dominant-baseline="central" fill="#0F6E56" font-weight="500">本地发音诊断</text>

  <rect x="40" y="258" width="600" height="40" fill="#FBFBF9"/>
  <text x="56" y="278" dominant-baseline="central">阅读整合</text>
  <text x="206" y="278" dominant-baseline="central" fill="#888780">无</text>
  <text x="386" y="278" dominant-baseline="central" fill="#888780">无</text>
  <text x="546" y="278" dominant-baseline="central" fill="#0F6E56" font-weight="500">阅读器 + 划词建卡</text>

  <rect x="40" y="298" width="600" height="40" fill="#FFFFFF"/>
  <text x="56" y="318" dominant-baseline="central">数据归属</text>
  <text x="206" y="318" dominant-baseline="central" fill="#888780">云端账号</text>
  <text x="386" y="318" dominant-baseline="central">本地</text>
  <text x="546" y="318" dominant-baseline="central" fill="#0F6E56" font-weight="500">本地</text>

  <rect x="40" y="338" width="600" height="40" fill="#FBFBF9"/>
  <text x="56" y="358" dominant-baseline="central">上手成本</text>
  <text x="206" y="358" dominant-baseline="central">低（打开就能学）</text>
  <text x="386" y="358" dominant-baseline="central" fill="#888780">高（自己拼工具链）</text>
  <text x="546" y="358" dominant-baseline="central">中（要自备材料）</text>
</g>
</svg>
